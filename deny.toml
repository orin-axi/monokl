[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # All crates in this workspace are intentionally source-available under
    # FSL-1.1-MIT, matching Lumen's Layer 2/4 crates and Wisp's upper layers.
    "FSL-1.1-MIT",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
